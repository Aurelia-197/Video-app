<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:sans-serif}
.container{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;gap:16px;padding:12px}
@media(max-width:850px){.container{grid-template-columns:1fr}}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:.4s}
.player.loaded iframe{opacity:1}
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#777}
.spinner{width:36px;height:36px;border:3px solid #222;border-top-color:#ff7a00;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player.loaded .loader{display:none}
#mainTitle{padding:12px 4px;font-size:18px}
.sidebar{display:flex;flex-direction:column;gap:10px}
.sideTitle{font-size:14px;color:#aaa;margin-bottom:4px}
.card{display:flex;gap:8px;background:#1e1e1e;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.card.active{border-color:#ff7a00;background:#2a2a2a}
.thumb{width:130px;height:75px;background:#000;border-radius:6px;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h4{font-size:13px;line-height:1.3}
.card p{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>

<div class="container">
  <div>
    <div class="player" id="playerWrap">
      <div class="loader"><div class="spinner"></div><span>Memuat video...</span></div>
      <iframe id="mainPlayer" src="https://drive.google.com/file/d/1tSDQDb3Yz3VPCH1-Imw_zYQPJyaA-RBH/preview" allowfullscreen allow="autoplay; fullscreen" onload="document.getElementById('playerWrap').classList.add('loaded')"></iframe>
    </div>
    <h1 id="mainTitle">Video 1</h1>
  </div>

  <div class="sidebar">
    <div class="sideTitle">Video Lainnya (4)</div>
    <div id="list"></div>
  </div>
</div>

<script>
const videos = [
  { id: "1tSDQDb3Yz3VPCH1-Imw_zYQPJyaA-RBH", title: "Video 1" },
  { id: "1w6AhVJOXRurRZwEjKCvT6i1e5LRaVfvw", title: "Video 2" },
  { id: "1_eujdYLBL5Q3g15k-qyd-Pqfqx6Q-VPR", title: "Video 3" },
  { id: "1DFk1hTDN9l6VUY2pbePBVfZFjm9_2l2_", title: "Video 4 - Tumpeng" },
];

const listEl = document.getElementById('list');
const mainPlayer = document.getElementById('mainPlayer');
const mainTitle = document.getElementById('mainTitle');
const playerWrap = document.getElementById('playerWrap');

function render(){
  listEl.innerHTML = "";
  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'card' + (mainPlayer.src.includes(v.id) ? ' active' : '');
    card.innerHTML = `<div class="thumb"><img src="https://drive.google.com/thumbnail?id=${v.id}" loading="lazy"></div><div><h4>${v.title}</h4><p>Klik untuk putar</p></div>`;
    card.onclick = () => {
      playerWrap.classList.remove('loaded');
      mainPlayer.src = `https://drive.google.com/file/d/${v.id}/preview`;
      mainTitle.innerText = v.title;
      setTimeout(()=>playerWrap.classList.add('loaded'), 2000);
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
    listEl.appendChild(card);
  });
}
render();
setTimeout(()=>playerWrap.classList.add('loaded'), 2500);
</script>

</body>
</html>
